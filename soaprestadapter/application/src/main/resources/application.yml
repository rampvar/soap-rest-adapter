camel:
  cxf:
    inventory: /inventory
    hello: /hello

spring:
  profiles:
    active: mysql
  config:
    import: "classpath:application-wsdl-jobs.yml"

soap:
  fault:
    namespace: http://schemas.xmlsoap.org/soap/envelope/

app:
  connector: AMT
  cache:
    type: caffeine # or redis or simple or ehcache

auth:
  jwt_token_required: true

entitlement:
  strategy: USER_ROLE_GROUP  # or AWS_IAM

environment:
  aws: local # or Actual

aws:
  iam:
    region: us-east-1
    roleArn: arn:aws:iam::123456789012:role/MyAppRole

iam:
  roleMappings:
    alice: AdminRole
    bob: ReadOnlyRole
  permissions:
    AdminRole:
      - read
      - write
      - delete
    ReadOnlyRole:
      - read
